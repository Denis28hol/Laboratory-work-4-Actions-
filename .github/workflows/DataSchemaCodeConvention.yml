name: Data Schema Code Convention

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sql_check:
    name: SQL Schema Lint
    runs-on: ubuntu-latest
    steps:
      # Клон репозиторію
      - name: Checkout repository
        uses: actions/checkout@v4

      # Встановлення sqlfluff
      - name: Install sqlfluff
        run: |
          pip install --upgrade pip
          pip install sqlfluff

      # Перевірка SQL-схеми з вказанням діалекту
      - name: Lint SQL schema
        run: |
          echo "=== Checking DataSchema.sql ==="
          sqlfluff lint DataSchema.sql --dialect=postgres
